; PlatformIO project config for the TLV320DAC3100 MP3 player.
; Board: Freenove ESP32-S3-WROOM (PlatformIO's registered manifest targets
; the N8R8 variant — 8MB flash, 8MB octal PSRAM). If your board is the
; N16R8 (16MB flash) variant, this still works unmodified: the partition
; table below only needs 8MB, so it just leaves the extra flash unused.

[env:freenove_esp32_s3_wroom]
platform  = espressif32 @ ^6.12.0
board     = freenove_esp32_s3_wroom
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Flash mode/PSRAM type are left to this board's own PlatformIO manifest
; rather than overridden here — it already knows it's QIO flash + octal
; (OPI) PSRAM. -DBOARD_HAS_PSRAM is kept explicit as a harmless belt-and-
; braces in case the manifest doesn't already define it.
build_flags =
    -DBOARD_HAS_PSRAM

; --- Custom partition table ---
; 2MB app / ~5.9MB LittleFS — the ~2.3MB audio file doesn't fit in any of
; the stock partition schemes, which only give ~1.5MB to the filesystem.
board_build.partitions = partitions.csv

; --- Filesystem ---
; Tells "Upload Filesystem Image" to build a LittleFS image (from ./data)
; instead of SPIFFS.
board_build.filesystem = littlefs

; --- Libraries ---
; Pulled directly from their repos rather than the registry, so you get
; exactly what was tested against this sketch.
lib_deps =
    https://github.com/adafruit/Adafruit_TLV320_I2S.git
    https://github.com/adafruit/Adafruit_BusIO.git
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
